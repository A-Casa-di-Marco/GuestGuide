name: Deploy su Cloudflare Workers

on:
  push:
    branches: [main, feat/cloudflare]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configura wrangler per Cloudflare
        run: node scripts/patch-wrangler.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Applica migrazioni D1
        run: npx wrangler d1 migrations apply DB --config dist/server/wrangler.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnostica URL pubblico
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then URL="https://a-casa-di-maro.casa-di-marco.workers.dev"; fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
          DESC="deployed=${URL} home=${CODE}"
          echo "$DESC"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"cloudflare/deploy-url\",\"description\":\"$DESC\"}"

      - name: Imposta password del pannello
        run: echo "$OWNER_PASSWORD" | npx wrangler secret put OWNER_PASSWORD --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}

      - name: Imposta chiave OpenRouter (chat di Marco)
        run: echo "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
